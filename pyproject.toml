[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "officegrep"
version = "0.1.1"
description = "Full-text search inside Word, PowerPoint, Excel and PDF, served to agents over MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "search", "docx", "xlsx", "pptx", "pdf", "sqlite", "fts5", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["lxml>=4.9", "openpyxl>=3.1"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["python-docx>=1.1", "python-pptx>=0.6", "pypdf>=4.0"]

[project.scripts]
officegrep = "officegrep.cli:main"

[tool.setuptools.packages.find]
include = ["officegrep*"]
